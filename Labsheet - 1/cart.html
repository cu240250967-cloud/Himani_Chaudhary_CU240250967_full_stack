<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechKart - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container navbar">
        <h1 class="logo">TechKart</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </div>
</header>

<main class="container section">

    <h2 class="section-title">Shopping Cart</h2>

    <div class="table-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Wireless Headphones</td>
                    <td>1</td>
                    <td>₹1,999</td>
                    <td>₹1,999</td>
                </tr>

                <tr>
                    <td>Wireless Mouse</td>
                    <td>2</td>
                    <td>₹799</td>
                    <td>₹1,598</td>
                </tr>

                <tr class="total-row">
                    <td colspan="3"><strong>Grand Total</strong></td>
                    <td><strong>₹3,597</strong></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="cart-actions">
        <a href="products.html" class="btn secondary-btn">Continue Shopping</a>
        <a href="checkout.html" class="btn">Proceed to Checkout</a>
    </div>

</main>

<footer>
    <div class="container">
        <p>Contact: support@techkart.com | Phone: +91 98765 43210</p>
        <p>&copy; 2026 TechKart. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
